spring:
  application:
    name: codeduel-app

  datasource:
    url: jdbc:postgresql://localhost:5433/codeduel
    username: codeduel
    password: codeduel

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto