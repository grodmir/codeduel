services:
  postgres:
    image: postgres:18
    container_name: codeduel-postgres
    environment:
      POSTGRES_DB: codeduel
      POSTGRES_USER: codeduel
      POSTGRES_PASSWORD: codeduel
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: codeduel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: codeduel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
  redis_data:
